services:
  - type: web
    name: kansas-las-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: HF_REPO_ID
        value: your-username/kansas-las-files
